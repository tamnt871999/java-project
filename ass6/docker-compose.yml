services:

  redis-master:
    image: redis:7.4-alpine
    container_name: ass6-redis-master
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  redis-replica:
    image: redis:7.4-alpine
    container_name: ass6-redis-replica
    command: ["redis-server", "--replicaof", "redis-master", "6379"]
    ports:
      - "6380:6379"
    depends_on:
      redis-master:
        condition: service_healthy
